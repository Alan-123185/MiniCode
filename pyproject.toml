[project]
name = "minicode"
version = "1.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite==0.22.1",
    "fastapi==0.141.1",
    "langchain==1.3.15",
    "langchain-core==1.5.4",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.5.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "loguru==0.7.3",
    "numpy==2.5.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "starlette==1.6.0",
    "tree-sitter==0.26.0",
    "tree-sitter-analyzer==2.2.0",
    "tree-sitter-language-pack==1.20.0",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = ["pyinstaller==6.22.3"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # 只查语法错误和未使用的 import/变量